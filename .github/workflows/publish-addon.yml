name: Publish Home Assistant Add-on

on:
  push:
    branches: [main]
    paths:
      - addon-homesweethome/**
      - .github/workflows/publish-addon.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          with open('addon-homesweethome/config.yaml', 'r', encoding='utf-8') as f:
              for line in f:
                  if line.startswith('version:'):
                      print(line.split(':', 1)[1].strip())
                      break
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./addon-homesweethome
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/llingua/homesweethome-amd64:${{ steps.version.outputs.version }}
            ghcr.io/llingua/homesweethome-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/llingua/homesweethome-armv7:${{ steps.version.outputs.version }}
